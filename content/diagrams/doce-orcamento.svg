<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="doce-title doce-desc"><title id="doce-title">Doce Orçamento: do roteiro às duas versões</title><desc id="doce-desc">O roteiro, as regras do caixa e os quizzes ficam em arquivos YAML. Um pipeline em Python, dentro do Docker, valida esse conteúdo, prepara artes e áudio e gera as duas versões: os scripts do Ren'Py, empacotados num .exe e num instalador para Windows, e a versão em HTML5 e JavaScript, que funciona offline nos Chromebooks e roda na página do projeto.</desc><defs><marker id="doce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M440,92 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#doce-arrow)"/><path d="M380,178 V187.0 Q380,195.0 372,195.0 H228 Q220,195.0 220,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#doce-arrow)"/><path d="M500,178 V187.0 Q500,195.0 508,195.0 H652 Q660,195.0 660,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#doce-arrow)"/><path d="M220,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#doce-arrow)"/><path d="M660,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#doce-arrow)"/><rect x="223.0" y="273.0" width="59.6" height="16" fill="#EDE6D6"/><text x="228" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">EMPACOTA</text><rect x="663.0" y="273.0" width="109.2" height="16" fill="#EDE6D6"/><text x="668" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">MONTA O WEB/DIST</text><rect x="24" y="371" width="26" height="14" rx="3" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.2"/><text x="58" y="382" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">fonte única do conteúdo</text><rect x="260" y="40" width="360" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Conteúdo em YAML</text><text x="440.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">roteiro, regras do caixa e quizzes</text><rect x="260" y="126" width="360" height="52" rx="6" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/><text x="440.0" y="150.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#FFF8EC">Pipeline em Python</text><text x="440.0" y="166.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#FFF8EC">no Docker: valida, artes e áudio</text><rect x="40" y="212" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="220.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Ren&#x27;Py</text><text x="220.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">scripts .rpy gerados</text><rect x="480" y="212" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="660.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Versão web</text><text x="660.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">HTML5 e JavaScript, sem dependências</text><rect x="40" y="298" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="220.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">.exe e instalador</text><text x="220.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">Windows, com NSIS</text><rect x="480" y="298" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="660.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">PWA offline</text><text x="660.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">Chromebooks e esta página</text></svg>
