<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 606" role="img" aria-labelledby="vault-sync-title vault-sync-desc"><title id="vault-sync-title">vault-sync: o caminho de um jogo</title><desc id="vault-sync-desc">O botão Jogar da Steam ou do Heroic, ou o catálogo no SUPER+G, chama o vault-sync. Se o servidor estiver desligado, ele manda o ESP32 acordá-lo por MQTT com TLS e Wake-on-LAN. Então baixa o jogo e os saves por rsync, espera você fechar o jogo, sobe de volta só o que mudou e libera o SSD. No desligamento do PC, o systemd sobe o que tiver ficado pendente.</desc><defs><marker id="vault-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M130,92 V101.0 Q130,109.0 138,109.0 H192 Q200,109.0 200,117.0 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M330,92 V101.0 Q330,109.0 322,109.0 H268 Q260,109.0 260,117.0 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M420,152.0 H498" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M670,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M500,238.0 H422" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M420,410.0 H498" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M670,470 V438" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#vault-sync-arrow)"/><path d="M230,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M230,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M230,350 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><path d="M230,436 V468" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#vault-sync-arrow)"/><rect x="423.0" y="130.0" width="72.0" height="16" fill="#EDE6D6"/><text x="459" y="141.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">DESLIGADO?</text><rect x="673.0" y="187.0" width="47.2" height="16" fill="#EDE6D6"/><text x="678" y="198.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">ACORDA</text><rect x="440.5" y="216.0" width="41.0" height="16" fill="#EDE6D6"/><text x="461" y="227.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">RSYNC</text><rect x="438.5" y="388.0" width="41.0" height="16" fill="#EDE6D6"/><text x="459" y="399.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">RSYNC</text><rect x="673.0" y="445.0" width="109.2" height="16" fill="#EDE6D6"/><text x="678" y="456.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">SOBE O QUE FICOU</text><rect x="24" y="547" width="26" height="14" rx="3" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.2"/><text x="58" y="558" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">onde o resultado fica</text><path d="M237.20000000000002,554 H259.20000000000005" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#vault-sync-arrow)"/><text x="271.20000000000005" y="558" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">só se algo ficou pendente</text><rect x="40" y="40" width="180" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="130.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="16" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Steam · Heroic</text><text x="130.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">botão Jogar</text><rect x="240" y="40" width="180" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="330.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="16" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Catálogo</text><text x="330.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">SUPER+G</text><rect x="40" y="126" width="380" height="52" rx="6" fill="#FF5F1F" stroke="#1A1A1A" stroke-width="2"/><text x="230.0" y="150.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">vault-sync run</text><text x="230.0" y="166.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">um binário em Rust</text><rect x="500" y="126" width="340" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="670.0" y="150.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">ESP32</text><text x="670.0" y="166.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">MQTT com TLS → Wake-on-LAN</text><rect x="500" y="212" width="340" height="224" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="670.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Servidor</text><text x="670.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">onde os jogos ficam</text><rect x="40" y="212" width="380" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="230.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Baixa</text><text x="230.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">jogo e saves</text><rect x="40" y="298" width="380" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="230.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Você joga</text><text x="230.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">o vault-sync espera fechar</text><rect x="40" y="384" width="380" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="230.0" y="408.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Sobe de volta</text><text x="230.0" y="424.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">só o que mudou</text><rect x="40" y="470" width="380" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="230.0" y="494.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Libera o SSD</text><text x="230.0" y="510.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">o espaço local volta</text><rect x="500" y="470" width="340" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="670.0" y="494.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">systemd</text><text x="670.0" y="510.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">no desligamento do PC</text></svg>
