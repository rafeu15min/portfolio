<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="kernel-heimdall-title kernel-heimdall-desc"><title id="kernel-heimdall-title">Kernel Heimdall: o boot e uma tecla</title><desc id="kernel-heimdall-desc">No boot, o bootloader entrega o controle ao kernel, que carrega a GDT com uma pilha extra para o double fault, a IDT com quem atende cada interrupção, inicia o PIC 8259, liga as interrupções com sti e dorme com hlt. Uma tecla vai do teclado PS/2 ao PIC, que avisa a CPU pela IRQ 1; a IDT aponta o tratador, que lê a porta 0x60, decodifica e imprime com a macro print! no buffer VGA em 0xb8000, e então avisa o PIC que terminou.</desc><defs><marker id="kernel-heimdall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="24" y="40" width="400" height="528" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="36" y="32" width="38" height="16" fill="#EDE6D6"/><text x="42" y="44" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">BOOT</text><rect x="456" y="40" width="400" height="442" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="468" y="32" width="71" height="16" fill="#EDE6D6"/><text x="474" y="44" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">UMA TECLA</text><path d="M224,116 V148" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M224,202 V234" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M224,288 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M224,374 V406" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M224,460 V492" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M656,116 V148" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M656,202 V234" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M656,288 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M656,374 V406" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kernel-heimdall-arrow)"/><path d="M400,262.0 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#kernel-heimdall-arrow)"/><path d="M832,270.0 H840 Q848,270.0 848,262.0 V192.0 Q848,184.0 840,184.0 H834" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#kernel-heimdall-arrow)"/><rect x="415.4" y="240.0" width="47.2" height="16" fill="#EDE6D6"/><text x="439" y="251.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">APONTA</text><rect x="787.4" y="211.0" width="59.6" height="16" fill="#EDE6D6"/><text x="842" y="222.5" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">TERMINEI</text><rect x="48" y="64" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="88.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Bootloader</text><text x="224.0" y="104.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">QEMU · imagem do bootimage</text><rect x="48" y="150" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="174.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">GDT</text><text x="224.0" y="190.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">pilha extra para o double fault</text><rect x="48" y="236" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="260.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">IDT</text><text x="224.0" y="276.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">quem atende cada interrupção</text><rect x="48" y="322" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="346.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">PIC 8259</text><text x="224.0" y="362.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">liga as linhas de hardware</text><rect x="48" y="408" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="432.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">sti</text><text x="224.0" y="448.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">interrupções ligadas</text><rect x="48" y="494" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="518.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">hlt</text><text x="224.0" y="534.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">dorme até a próxima</text><rect x="480" y="64" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="656.0" y="88.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Teclado PS/2</text><text x="656.0" y="104.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">você aperta uma tecla</text><rect x="480" y="150" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="656.0" y="174.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">PIC 8259</text><text x="656.0" y="190.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">IRQ 1 avisa a CPU</text><rect x="480" y="236" width="352" height="52" rx="6" fill="#FF5F1F" stroke="#1A1A1A" stroke-width="2"/><text x="656.0" y="260.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Tratador</text><text x="656.0" y="276.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">lê a porta 0x60 e decodifica</text><rect x="480" y="322" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="656.0" y="346.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">print!</text><text x="656.0" y="362.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">macro própria</text><rect x="480" y="408" width="352" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="656.0" y="432.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">VGA 0xb8000</text><text x="656.0" y="448.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">o caractere aparece</text></svg>
