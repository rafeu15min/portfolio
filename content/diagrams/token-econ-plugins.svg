<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 606" role="img" aria-labelledby="token-econ-plugins-title token-econ-plugins-desc"><title id="token-econ-plugins-title">Token Econ. Plugins: por onde passa cada chamada</title><desc id="token-econ-plugins-desc">Um hook classifica o risco de cada pedido e o Claude Code, em Sonnet, faz as tarefas comuns ou delega às faixas baixa e alta, que rodam em Haiku e em Opus. Antes de escrever código, a skill yagni-enforcer confere se ele é preciso e, passando, o código segue SOLID. A memória do claude-mem passa pelo Headroom, que enxuga o contexto, e chega ao OmniRoute. Os comandos vão pelo script executor ao OpenCode, que usa um modelo mais barato pelo OmniRoute e, se ele falhar, os modelos grátis do próprio OpenCode. O OmniRoute distribui os pedidos entre contas com cota grátis. Headroom e OmniRoute são projetos abertos de terceiros.</desc><defs><marker id="token-econ-plugins-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M260,92 V101.0 Q260,109.0 268,109.0 H402 Q410,109.0 410,117.0 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M520,126 V94" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M590,152.0 H648" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><path d="M410,178 V187.0 Q410,195.0 402,195.0 H268 Q260,195.0 260,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M470,178 V187.0 Q470,195.0 478,195.0 H612 Q620,195.0 620,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M260,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M620,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M260,350 V359.0 Q260,367.0 268,367.0 H402 Q410,367.0 410,375.0 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M620,350 V359.0 Q620,367.0 612,367.0 H478 Q470,367.0 470,375.0 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M720,350 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><path d="M440,436 V468" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><rect x="314.5" y="101.0" width="41.0" height="16" fill="#EDE6D6"/><text x="335" y="112.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">RISCO</text><rect x="523.0" y="101.0" width="47.2" height="16" fill="#EDE6D6"/><text x="528" y="112.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">DELEGA</text><rect x="723.0" y="359.0" width="65.8" height="16" fill="#EDE6D6"/><text x="728" y="370.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">SE FALHAR</text><rect x="24" y="547" width="26" height="14" rx="3" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="58" y="558" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">serviço na internet</text><path d="M222.8,554 H244.8" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><text x="256.8" y="558" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">reserva ou verificação</text><rec