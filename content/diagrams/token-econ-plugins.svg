<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="token-econ-plugins-title token-econ-plugins-desc"><title id="token-econ-plugins-title">Token Econ. Plugins: por onde passa cada chamada</title><desc id="token-econ-plugins-desc">O Claude Code escreve o código, com a skill yagni-enforcer conferindo antes se o código é preciso. A memória do claude-mem passa pelo Headroom, que enxuga o contexto, e chega ao OmniRoute. Os comandos vão pelo script executor ao OpenCode, que usa um modelo mais barato pelo OmniRoute e, se ele falhar, os modelos grátis do próprio OpenCode. O OmniRoute distribui os pedidos entre contas com cota grátis. Headroom e OmniRoute são projetos abertos de terceiros.</desc><defs><marker id="token-econ-plugins-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M590,66.0 H648" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><path d="M410,92 V101.0 Q410,109.0 402,109.0 H268 Q260,109.0 260,117.0 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M470,92 V101.0 Q470,109.0 478,109.0 H612 Q620,109.0 620,117.0 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M260,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M620,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M260,264 V273.0 Q260,281.0 268,281.0 H402 Q410,281.0 410,289.0 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M620,264 V273.0 Q620,281.0 612,281.0 H478 Q470,281.0 470,289.0 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><path d="M720,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><path d="M440,350 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#token-econ-plugins-arrow)"/><rect x="723.0" y="273.0" width="65.8" height="16" fill="#EDE6D6"/><text x="728" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">SE FALHAR</text><rect x="24" y="461" width="26" height="14" rx="3" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="58" y="472" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">serviço na internet</text><path d="M222.8,468 H244.8" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#token-econ-plugins-arrow)"/><text x="256.8" y="472" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">reserva ou verificação</text><rect x="290" y="40" width="300" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Claude Code</text><text x="440.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">o Opus escreve o código</text><rect x="650" y="40" width="210" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="755.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">yagni-enforcer</text><text x="755.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">skill: barra código a mais</text><rect x="130" y="126"