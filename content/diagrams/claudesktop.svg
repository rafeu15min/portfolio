<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="claudesktop-title claudesktop-desc"><title id="claudesktop-title">Claudesktop: como o Claude age na tela</title><desc id="claudesktop-desc">O Claude Code chama o servidor MCP, que escolhe o caminho pelo alvo: AT-SPI para apps GTK ou Qt, CDP para páginas no Chromium, e OCR seguido de mouse e teclado reais (ydotool) para terminais e jogos. A ação acontece ao vivo na tela do Hyprland, e cada ação devolve um print ao Claude.</desc><defs><marker id="claudesktop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M440,92 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M400,178 V187.0 Q400,195.0 392,195.0 H168 Q160,195.0 160,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M440,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M480,178 V187.0 Q480,195.0 488,195.0 H712 Q720,195.0 720,203.0 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M160,264 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M440,264 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M720,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M720,350 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#claudesktop-arrow)"/><path d="M840,410.0 H856 Q864,410.0 864,402.0 V74.0 Q864,66.0 856,66.0 H592" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#claudesktop-arrow)"/><rect x="163.0" y="273.0" width="103.0" height="16" fill="#EDE6D6"/><text x="168" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">CLICA PELO NOME</text><rect x="443.0" y="273.0" width="96.8" height="16" fill="#EDE6D6"/><text x="448" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">CLICA PELO DOM</text><rect x="723.0" y="273.0" width="96.8" height="16" fill="#EDE6D6"/><text x="728" y="284.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">ACHA A POSIÇÃO</text><rect x="739.4" y="101" width="121.6" height="16" fill="#EDE6D6"/><text x="856" y="112.5" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">PRINT DE CADA AÇÃO</text><rect x="290" y="40" width="300" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Claude Code</text><text x="440.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">pede uma ação</text><rect x="290" y="126" width="300" height="52" rx="6" fill="#FF5F1F" stroke="#1A1A1A" stroke-width="2"/><text x="440.0" y="150.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Servidor MCP</text><text x="440.0" y="166.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">escolhe o caminho pelo alvo</text><rect x="40" y="212" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="160.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">AT-SPI</text><text x="160.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">app GTK ou Qt</text><rect x="320" y="212" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">CDP</text><text x="440.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">página no Chromium</text><rect x="600" y="212" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="720.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">OCR</text><text x="720.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">terminal ou jogo</text><rect x="600" y="298" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="720.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">ydotool</text><text x="720.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">mouse e teclado reais</text><rect x="40" y="384" width="800" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="408.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Tela do Hyprland</text><text x="440.0" y="424.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">a ação acontece ao vivo</text></svg>
