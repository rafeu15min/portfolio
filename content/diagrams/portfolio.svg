<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" role="img" aria-labelledby="portfolio-title portfolio-desc"><title id="portfolio-title">Portfólio: publicar e visitar</title><desc id="portfolio-desc">Um push na main dispara a GitHub Action, que monta o site em Vue e a API em Rust numa imagem Docker pública no GHCR. Na VM da Oracle em São Paulo, um timer puxa a imagem nova a cada 5 minutos. O visitante chega pelo Caddy, com HTTPS do Let&#x27;s Encrypt, até a API, que serve o site, manda o e-mail do contato pelo Resend e busca estrelas e pushes na API do GitHub.</desc><defs><marker id="portfolio-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="464" y="128" width="392" height="178" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="476" y="120" width="151" height="16" fill="#EDE6D6"/><text x="482" y="132" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">VM ORACLE · SÃO PAULO</text><path d="M220,116 V148" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M220,202 V234" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M660,116 V148" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M660,202 V234" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M400,262.0 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M620,288 V297.0 Q620,305.0 612,305.0 H573 Q565,305.0 565,313.0 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfolio-arrow)"/><path d="M700,288 V297.0 Q700,305.0 708,305.0 H747 Q755,305.0 755,313.0 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#portfo