nt-size="11" fill="#1A1A1A">monta Vue e Rust numa imagem</text><rect x="40" y="236" width="360" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="220.0" y="260.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">GHCR</text><text x="220.0" y="276.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">imagem Docker pública</text><rect x="480" y="64" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="660.0" y="88.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Visitante</text><text x="660.0" y="104.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">navegador</text><rect x="480" y="150" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="660.0" y="174.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Caddy</text><text x="660.0" y="190.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">HTTPS do Let&#x27;s Encrypt</text><rect x="480" y="236" width="360" height="52" rx="6" fill="#FF5F1F" stroke="#1A1A1A" stroke-width="2"/><text x="660.0" y="260.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">API em Rust</text><text x="660.0" y="276.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">serve o site e o /api</text><rect x="480" y="322" width="170" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" st