<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" role="img" aria-labelledby="anubis-video-title anubis-video-desc"><title id="anubis-video-title">Anubis: descobrir e assistir</title><desc id="anubis-video-desc">O app em Vue fala com o Anubis; a vitrine usa TMDB, AniList e o histórico importado, a busca consulta o Prowlarr e as faixas reais no Anime Tosho e no bitmagnet, o Assistir agora baixa com o librqbit, importa no Radarr e no Sonarr e passa o torrent ao qBittorrent, e a central de estado acompanha o Jellyfin.</desc><defs><marker id="anubis-video-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="208" y="32" width="304" height="440" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="220" y="24" width="98" height="16" fill="#EDE6D6"/><text x="226" y="36" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">ANUBIS · RUST</text><path d="M488,78 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,122 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,182 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,226 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,286 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,330 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M488,412 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><path d="M160,204 H230" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#anubis-video-arrow)"/><rect x="520.4" y="56"