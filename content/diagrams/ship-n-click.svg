<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 514" role="img" aria-labelledby="ship-n-click-title ship-n-click-desc"><title id="ship-n-click-title">Ship'n'click: Rust e C# dentro da Godot</title><desc id="ship-n-click-desc">A nave, os meteoros e os tiros são classes em Rust carregadas pela Godot via GDExtension. Elas avisam o GameManager em C# por sinais: morte, quase-colisão, moedas coletadas e dano causado. O GameManager cuida da run, das moedas e do respawn pago, e responde chamando métodos do Rust, como respawn e níveis da nave. Os power-ups vêm de um JSON e aparecem na janela de power-ups; o HUD mostra XP, setas e o cadáver.</desc><defs><marker id="ship-n-click-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="24" y="40" width="400" height="270" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="36" y="32" width="131" height="16" fill="#EDE6D6"/><text x="42" y="44" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">RUST · GDEXTENSION</text><rect x="456" y="40" width="400" height="442" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="468" y="32" width="25" height="16" fill="#EDE6D6"/><text x="474" y="44" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">C#</text><path d="M400,80.0 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M480,102.0 H402" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M400,176.0 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M400,262.0 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M620,288 V297.0 Q620,305.0 612,305.0 H573 Q565,305.0 565,313.0 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M700,288 V297.0 Q700,305.0 708,305.0 H747 Q755,305.0 755,313.0 V320" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><path d="M565,408 V376" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ship-n-click-arrow)"/><rect x="415.4" y="58.0" width="47.2" height="16" fill="#EDE6D6"/><text x="439" y="69.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">MORREU</text><rect x="414.3" y="108.0" width="53.4" height="16" fill="#EDE6D6"/><text x="441" y="119.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">RENASCE</text><rect x="415.4" y="154.0" width="47.2" height="16" fill="#EDE6D6"/><text x="439" y="165.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">MOEDAS</text><rect x="421.6" y="240.0" width="34.8" height="16" fill="#EDE6D6"/><text x="439" y="251.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">DANO</text><rect x="568.0" y="383.0" width="22.4" height="16" fill="#EDE6D6"/><text x="573" y="394.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">LÊ</text><rect x="48" y="64" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="88.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Nave</text><text x="224.0" y="104.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">física, tiro, mina</text><rect x="48" y="150" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="174.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Meteoros</text><text x="224.0" y="190.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">nascem, racham, dão moedas</text><rect x="48" y="236" width="352" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="224.0" y="260.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Tiros</text><text x="224.0" y="276.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">pool reaproveitado</text><rect x="480" y="64" width="352" height="224" rx="6" fill="#FF5F1F" stroke="#1A1A1A" stroke-width="2"/><text x="656.0" y="174.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">GameManager</text><text x="656.0" y="190.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">run, moedas, respawn pago</text><rect x="480" y="322" width="170" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="565.0" y="346.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="16" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Power-ups</text><text x="565.0" y="362.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">janela e efeitos</text><rect x="670" y="322" width="162" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="751.0" y="346.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="16" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">HUD</text><text x="751.0" y="362.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">XP, setas, cadáver</text><rect x="480" y="408" width="170" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="565.0" y="432.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="16" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">powerups.json</text><text x="565.0" y="448.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">regras em dados</text></svg>
