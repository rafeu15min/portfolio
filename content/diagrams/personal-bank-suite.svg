<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" role="img" aria-labelledby="pbs-title pbs-desc"><title id="pbs-title">Arquitetura do Personal Bank Suite</title><desc id="pbs-desc">O ms-consent conduz o consentimento OAuth com o banco, guarda os tokens no PostgreSQL e publica um evento no Kafka; os três serviços de dados consomem o evento, pedem o token ao ms-consent, buscam os dados no banco e gravam cada um no seu schema.</desc><defs><marker id="pbs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><rect x="480" y="172" width="376" height="192" rx="8" fill="none" stroke="#3B362E" stroke-width="1.2" stroke-dasharray="6,4"/><rect x="492" y="164" width="124" height="16" fill="#EDE6D6"/><text x="498" y="176" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#3B362E">SERVIÇOS DE DADOS</text><path d="M160,84 H230" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M400,84 H598" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M316,120 V194" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M400,224 H478" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M728,172 V114" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M648,172 V156 Q648,148 640,148 H376 Q368,148 368,140 V122" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#pbs-arrow)"/><path d="M256,120 V140 Q256,148 248,148 H124 Q116,148 116,156 V194" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><path d="M480,332 H124 Q116,332 116,324 V254" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#pbs-arrow)"/><rect x="172.4" y="62" width="47.2" height="16" fill="#