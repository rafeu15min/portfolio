<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 602" role="img" aria-labelledby="kaiak-title kaiak-desc"><title id="kaiak-title">KaiaK: do kaiak.lua à janela</title><desc id="kaiak-desc">Na partida, o Lua do fengari lê o kaiak.lua e devolve dados: layout, tema, atalhos e botões. O processo principal do Electron monta a janela com esses dados: trilho de abas e barras são views em HTML e JavaScript, e cada aba é uma página do Chromium. Toda requisição das abas passa pelas listas de bloqueio antes de sair para a internet. O k.exec roda comandos da máquina pedidos pela configuração.</desc><defs><marker id="kaiak-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/></marker></defs><path d="M440,92 V124" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M440,178 V210" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M360,264 V273.0 Q360,281.0 352,281.0 H168 Q160,281.0 160,289.0 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M440,264 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M520,264 V273.0 Q520,281.0 528,281.0 H712 Q720,281.0 720,289.0 V296" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M440,350 V382" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><path d="M440,436 V468" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#kaiak-arrow)"/><rect x="443.0" y="187.0" width="72.0" height="16" fill="#EDE6D6"/><text x="448" y="198.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">VIRA DADOS</text><rect x="443.0" y="359.0" width="103.0" height="16" fill="#EDE6D6"/><text x="448" y="370.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">CADA REQUISIÇÃO</text><rect x="443.0" y="445.0" width="78.2" height="16" fill="#EDE6D6"/><text x="448" y="456.5" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.04em" fill="#3B362E">O QUE PASSA</text><rect x="24" y="543" width="26" height="14" rx="3" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.2"/><text x="58" y="554" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">configuração do usuário</text><rect x="251.6" y="543" width="26" height="14" rx="3" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.2" stroke-dasharray="4,3"/><text x="285.6" y="554" font-family="'Courier Prime', 'Courier New', monospace" font-size="12" fill="#3B362E">serviço na internet</text><rect x="260" y="40" width="360" height="52" rx="6" fill="#C8A676" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="64.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">kaiak.lua</text><text x="440.0" y="80.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">layout, tema, atalhos e botões</text><rect x="260" y="126" width="360" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="150.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Lua (fengari)</text><text x="440.0" y="166.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">na partida e nas teclas do k.bind</text><rect x="260" y="212" width="360" height="52" rx="6" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/><text x="440.0" y="236.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#FFF8EC">Processo principal</text><text x="440.0" y="252.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#FFF8EC">Electron: monta a janela</text><rect x="40" y="298" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="160.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Trilho e barras</text><text x="160.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">views em HTML e JS</text><rect x="320" y="298" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Abas</text><text x="440.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">páginas do Chromium</text><rect x="600" y="298" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="720.0" y="322.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">k.exec</text><text x="720.0" y="338.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">comandos da máquina</text><rect x="320" y="384" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.6"/><text x="440.0" y="408.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Bloqueio</text><text x="440.0" y="424.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">anúncios, rastreadores, malware</text><rect x="320" y="470" width="240" height="52" rx="6" fill="#FBF8F1" stroke="#1A1A1A" stroke-width="1.4" stroke-dasharray="6,4"/><text x="440.0" y="494.0" text-anchor="middle" font-family="'Big Shoulders Stencil Display', Impact, sans-serif" font-size="19" font-weight="800" letter-spacing="0.03em" fill="#1A1A1A">Sites</text><text x="440.0" y="510.0" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="11" fill="#1A1A1A">na internet</text></svg>
